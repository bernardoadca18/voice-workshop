services:
  kokoro:
    image: hwdsl2/kokoro-server:cuda
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "8880:8880"
    volumes:
      - kokoro-data:/var/lib/kokoro
    environment:
      - KOKORO_API_KEY=${KOKORO_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Fallback: TCP connect healthcheck (Kokoro não expõe endpoint de health documentado)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8880/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  seedvc:
    build: ./seedvc
    container_name: seedvc
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
      - ./data/runs:/app/runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  orchestrator:
    build: ./orchestrator
    container_name: voice-orchestrator
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./data:/data
    environment:
      - KOKORO_URL=http://kokoro:8880/v1/audio/speech
      - SEEDVC_URL=http://seedvc:8001
      - KOKORO_API_KEY=${KOKORO_API_KEY}
      - KOKORO_VOICE=${KOKORO_VOICE:-pm_alex}
    depends_on:
      kokoro:
        condition: service_healthy
      seedvc:
        condition: service_healthy

volumes:
  kokoro-data:
    name: kokoro-data
services:
  kokoro:
    image: hwdsl2/kokoro-server:cuda
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "8880:8880"
    volumes:
      - kokoro-data:/var/lib/kokoro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  seedvc:
    build: ./seedvc
    container_name: seedvc
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  orchestrator:
    build: ./orchestrator
    container_name: voice-orchestrator
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./data:/data
    environment:
      - KOKORO_URL=http://kokoro:8880/v1/audio/speech
      - SEEDVC_URL=http://seedvc:8001
      - KOKORO_API_KEY=${KOKORO_API_KEY}
      - KOKORO_VOICE=${KOKORO_VOICE:-pm_alex}
    depends_on:
      - kokoro
      - seedvc

volumes:
  kokoro-data:
    name: kokoro-data
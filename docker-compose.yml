services:
  kokoro:
    image: hwdsl2/kokoro-server:cuda
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "8880:8880"
    volumes:
      - kokoro-data:/var/lib/kokoro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  seedvc:
    build: ./seedvc
    container_name: seedvc
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    stdin_open: true

volumes:
  kokoro-data:
    name: kokoro-data